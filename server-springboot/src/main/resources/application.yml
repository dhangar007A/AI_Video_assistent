server:
  port: ${PORT:5000}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: ai-video-assistant-server
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai_video_assistant}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

app:
  python-path: ${PYTHON_PATH:python}
  project-root: ${PROJECT_ROOT:..}
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.aivideoassistant: INFO
    org.mongodb.driver: WARN
